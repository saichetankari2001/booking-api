name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.OCI_REGION }}.ocir.io
          username: ${{ vars.OCI_NAMESPACE }}/${{ secrets.OCI_AUTH_USER }}
          password: ${{ secrets.OCI_AUTH_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        run: |
          IMAGE="${{ vars.OCI_REGION }}.ocir.io/${{ vars.OCI_NAMESPACE }}/booking-api:${{ github.sha }}"
          LATEST="${{ vars.OCI_REGION }}.ocir.io/${{ vars.OCI_NAMESPACE }}/booking-api:latest"
          docker build -t "$IMAGE" -t "$LATEST" -f Dockerfile .
          docker push "$IMAGE"
          docker push "$LATEST"

      - name: Pull and restart the app container on the instance
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.OCI_INSTANCE_IP }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          envs: OCI_REGION,OCI_NAMESPACE,OCI_AUTH_USER,OCI_AUTH_TOKEN
          script: |
            echo "$OCI_AUTH_TOKEN" | sudo docker login "$OCI_REGION.ocir.io" -u "$OCI_NAMESPACE/$OCI_AUTH_USER" --password-stdin
            cd /opt/booking-api
            sudo docker compose pull app
            sudo docker compose up -d
        env:
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_NAMESPACE: ${{ vars.OCI_NAMESPACE }}
          OCI_AUTH_USER: ${{ secrets.OCI_AUTH_USER }}
          OCI_AUTH_TOKEN: ${{ secrets.OCI_AUTH_TOKEN }}
